<!DOCTYPE html>
<html>
<head>
    <title>Edit Query</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h3>Edit Query</h3>
    <form method="post">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ query[1] }}" required>
        </div>
        <div class="mb-3">
            <label>Age</label>
            <input type="number" name="age" class="form-control" value="{{ query[2] }}" required>
        </div>
        <div class="mb-3">
            <label>Gender</label>
            <input type="text" name="gender" class="form-control" value="{{ query[3] }}" required>
        </div>
        <div class="mb-3">
            <label>Location</label>
            <input type="text" name="location" class="form-control" value="{{ query[4] }}" required>
        </div>
        <div class="mb-3">
            <label>Symptoms</label>
            <input type="text" name="symptoms" class="form-control" value="{{ query[5] }}" required>
        </div>
        <div class="mb-3">
            <label>Disease</label>
            <input type="text" name="predicted_disease" class="form-control" value="{{ query[6] }}" required>
        </div>
        <div class="mb-3">
            <label>User</label>
            <input type="text" name="username" class="form-control" value="{{ query[7] }}" required>
        </div>
        <div class="mb-3">
            <label>Hospital(comma separated)</label>
            <input type="text" name="hospital" class="form-control" value="{{ query[8] }}" required>
           
</div>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
