<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
        }
        .login-box {
            background: #fff;
            padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            margin-top: 60px;
        }
        .btn-orange {
            background: #ff8800;
            color: #fff;
        }
        .btn-orange:hover {
            background: #ff6600;
            color: #fff;
        }
    </style>
</head>
<body>
  <div class="container content">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="login-box">
          <h3>Admin Login</h3>
          <form method="POST" action="{{ url_for('admin_login') }}">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-warning">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}
            <input type="text" name="username" class="form-control mb-3" placeholder="Enter admin username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Enter admin password" required>
            <button type="submit" class="btn btn-orange w-100">Login</button>
          </form>
          <div class="text-center mt-3">
              <a href="{{ url_for('login') }}" class="btn btn-secondary">User Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
