<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Medical Recommendation System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4 rounded">
                    <h2 class="text-center text-success">Create Account</h2>
                    <h6 class="text-center mb-4">Join our health community</h6>
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-danger">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}
                    <form method="POST" action="/register">
                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" placeholder="e.g. sandhya123" required>
                                <small class="text-muted">Must start with a letter, followed by letters/numbers</small>
                            </div>
                            <div class="mb-3 col-md-6">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="mb-3 col-md-6">
                                <label>Confirm Password</label>
                                <input type="password" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <label>Birthdate</label>
                                <input type="date" name="dob" class="form-control">
                            </div>
                            <div class="mb-3 col-md-6">
                                <label>Gender</label>
                                <select name="gender" class="form-select">
                                    <option value="" disabled selected>Select</option>
                                    <option>Female</option>
                                    <option>Male</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Location</label>
                            <input type="text" name="location" class="form-control" placeholder="City, Country">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Sign Up</button>
                    </form>
                    <div class="text-center mt-3">
                        Already have an account? <a href="/">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
