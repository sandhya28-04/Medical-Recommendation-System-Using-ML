<!DOCTYPE html>
<html>
<head>
    <title>Your Query History</title>
</head>
<body>
    <h2>History for {{ session['user'] }}</h2>
    <table border="1">
        <tr>
            <th>Name</th><th>Age</th><th>Gender</th><th>Location</th><th>Symptoms</th><th>Disease</th>
        </tr>
        {% for row in history %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{{ url_for('interface') }}">Back to Interface</a>
    <a href="{{ url_for('history') }}">{{ username }}</a>
</body>
</html>
