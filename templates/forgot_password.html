<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password - Medical Recommendation System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4 rounded">
          <h3 class="text-center text-warning">Forgot Password</h3>
          <p class="text-center">Enter your registered email to reset your password</p>

          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-info">{{ messages[0] }}</div>
            {% endif %}
          {% endwith %}

          <form method="POST" action="/forgot-password">
            <div class="mb-3">
              <label>Email address</label>
              <input type="email" name="email" class="form-control" placeholder="your.email@example.com" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Send Verification Code</button>
          </form>

          <div class="text-center mt-3">
            <a href="/">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
